[tool.poetry]
name = "fastapi-websocket-broadcast"
version = "0.0.0"
description = "FastAPI websocket demo"
authors = ["Kit Thwaite <28732700+kthwaite@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
aiofiles = "^24.1.0"
